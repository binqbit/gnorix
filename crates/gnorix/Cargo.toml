[package]
name = "gnorix"
description = "Biometric signing foundations and enrollment commitments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.1"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = { workspace = true, features = ["zeroize"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
