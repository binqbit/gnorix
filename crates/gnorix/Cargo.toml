[package]
name = "gnorix"
description = "Biometric signing foundations and enrollment commitments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
