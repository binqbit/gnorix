[package]
name = "gnorix"
description = "Biometric signing library with optional integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["core"]
core = ["dep:gnorix-core"]
near = ["dep:gnorix-near"]

[dependencies]
gnorix-core = { workspace = true, optional = true }
gnorix-near = { workspace = true, optional = true }

[lints]
workspace = true

[workspace]
members = [
    "crates/core",
    "crates/near",
    "examples/fingerprint-lab",
    "examples/support",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gnorix = { path = "." }
gnorix-core = { path = "crates/core" }
gnorix-near = { path = "crates/near" }
gnorix-example-support = { path = "examples/support" }
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
