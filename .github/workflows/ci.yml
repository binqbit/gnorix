name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build API documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --release --locked

  fingerprint-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.21"
          python-version: "3.13"
      - run: uv sync --project tools/fingerprint-reports --locked
      - run: uv run --project tools/fingerprint-reports --locked ruff check tools/fingerprint-reports
      - run: uv run --project tools/fingerprint-reports --locked ruff format --check tools/fingerprint-reports
      - run: uv run --project tools/fingerprint-reports --locked python -m unittest discover -s tools/fingerprint-reports/tests -v
      - name: Install Rust for the extraction-to-report check
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Generate the complete native fingerprint report
        run: uv run --project tools/fingerprint-reports --locked gnorix-report --image crates/gnorix/tests/assets/test-fingerprint.png
