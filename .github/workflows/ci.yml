name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build API documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --release --locked
      - name: Check the public library feature configurations
        run: |
          cargo check -p gnorix --no-default-features --locked
          cargo check -p gnorix --no-default-features --features core --locked
          cargo check -p gnorix --no-default-features --features near --locked
          cargo check -p gnorix --all-features --locked

  near-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust and Wasm target
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - name: Install NEAR build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev pkg-config
      - name: Install pinned NEAR build tool
        run: cargo install cargo-near --version 0.23.0 --locked
      - name: Check sandbox test code
        run: cargo clippy -p gnorix-near-wallet --features demo --all-targets --locked -- -D warnings
      - name: Build and test the NEAR example in sandbox
        run: ./examples/near/test.sh
      - name: Check the fingerprint transaction demo
        run: |
          cargo test -p gnorix-near-wallet --features demo --bin gnorix-near-demo --release --locked
          cargo test -p gnorix-near-wallet --features demo --bin gnorix-near-demo --release --locked -- --ignored --nocapture --test-threads=1

  fingerprint-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.21"
          python-version: "3.13"
      - run: uv sync --project tools/fingerprint-reports --locked
      - run: uv run --project tools/fingerprint-reports --locked ruff check tools/fingerprint-reports
      - run: uv run --project tools/fingerprint-reports --locked ruff format --check tools/fingerprint-reports
      - name: Check the gallery importer
        run: |
          uv run --project tools/fingerprint-reports --locked ruff check --config tools/fingerprint-reports/pyproject.toml tools/fingerprint-gallery
          uv run --project tools/fingerprint-reports --locked ruff format --check --config tools/fingerprint-reports/pyproject.toml tools/fingerprint-gallery
      - run: uv run --project tools/fingerprint-reports --locked python -m unittest discover -s tools/fingerprint-reports/tests -v
      - run: uv run --project tools/fingerprint-reports --locked python -m unittest discover -s tools/fingerprint-gallery -v
      - name: Install Rust for the extraction-to-report check
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Generate the complete native fingerprint report
        run: uv run --project tools/fingerprint-reports --locked gnorix-report --image crates/core/tests/assets/test-fingerprint.png
