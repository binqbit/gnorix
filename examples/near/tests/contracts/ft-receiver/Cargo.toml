[package]
name = "gnorix-ft-test-receiver"
description = "Test-only NEAR receiver for standard fungible token callback scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["unit-testing"] }

[lints]
workspace = true
