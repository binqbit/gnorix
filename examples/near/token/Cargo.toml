[package]
name = "gnorix-near-token"
description = "Standard NEAR fungible token for the Gnorix smart-wallet example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.2", features = ["non-contract-usage"] }
near-contract-standards = "=5.30.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["unit-testing"] }

[lints]
workspace = true
