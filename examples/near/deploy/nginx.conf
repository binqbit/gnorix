server {
    listen 80;
    listen [::]:80;
    server_name gnorix.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://gnorix.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gnorix.online;

    ssl_certificate /etc/nginx/tls/gnorix.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/gnorix.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GnorixTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /var/log/nginx/gnorix.access.log;
    error_log /var/log/nginx/gnorix.error.log;

    if ($host != gnorix.online) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
