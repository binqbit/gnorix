[package]
name = "gnorix-near-wallet"
description = "NEAR smart wallet authorizing standard token transfers with Gnorix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
sandbox = [
    "gnorix/core",
    "dep:anyhow",
    "dep:gnorix-example-support",
    "dep:near-workspaces",
    "dep:serde_json",
    "dep:tokio",
]
demo = [
    "sandbox",
    "dep:axum",
    "dep:getrandom",
    "dep:image",
    "dep:serde",
    "dep:near-jsonrpc-client",
    "dep:near-primitives",
    "dep:near-crypto",
    "dep:rustix",
]

[dependencies]
gnorix = { workspace = true, default-features = false, features = ["near"] }
near-sdk = "=5.30.2"
anyhow = { version = "1", optional = true }
gnorix-example-support = { workspace = true, optional = true }
near-workspaces = { version = "=0.24.0", optional = true }
serde_json = { workspace = true, optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
getrandom = { version = "0.4.1", optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
near-jsonrpc-client = { version = "=0.23.0", optional = true }
near-primitives = { version = "=0.38.1", optional = true }
near-crypto = { version = "=0.38.1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"], optional = true }

[[bin]]
name = "gnorix-near-demo"
path = "demo/main.rs"
required-features = ["demo"]

[[test]]
name = "wallet"
required-features = ["sandbox"]

[[test]]
name = "fungible_token"
required-features = ["sandbox"]

[lints]
workspace = true
