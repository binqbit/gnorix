[package]
name = "gnorix-near-integration-tests"
description = "Core-to-contract authorization tests in a local NEAR sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autolib = false

[features]
default = []
sandbox = ["dep:anyhow", "dep:gnorix", "dep:gnorix-example-support", "dep:near-workspaces", "dep:serde_json", "dep:tokio"]

[dependencies]
anyhow = { version = "1", optional = true }
gnorix = { workspace = true, features = ["near"], optional = true }
gnorix-example-support = { workspace = true, optional = true }
near-workspaces = { version = "=0.24.0", optional = true }
serde_json = { workspace = true, optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"], optional = true }

[[test]]
name = "authorization"
required-features = ["sandbox"]

[lints]
workspace = true
