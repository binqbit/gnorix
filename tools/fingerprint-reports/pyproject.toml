[project]
name = "gnorix-fingerprint-reports"
version = "0.1.0"
description = "Native fingerprint analysis and PNG reports for Gnorix"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pillow>=12,<14",
]

[project.scripts]
gnorix-report = "gnorix_reports.cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gnorix_reports"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
